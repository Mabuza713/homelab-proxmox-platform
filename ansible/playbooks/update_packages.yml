---
- hosts: all
  become: true
  tasks:
    - name: "Update all packages on debian/ubuntu"
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
      when: ansible_os_family == "Debian"

    - name: "Check wheter reboot is required on debian/ubuntu"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"
